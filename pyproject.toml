[project]
name = "echoloom"
version = "0.1.0"
description = "录音笔流水线：挂载检测 -> 切分 -> 转录 -> 润色 -> 每日总结"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wnma3mz" }]
keywords = ["asr", "transcription", "whisper", "llm", "voice-memo", "jnn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "aiohttp>=3.10",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/wnma3mz/echoloom"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
